# .github/workflows/fetch.yml
name: Fetchspeed

on:
  workflow_dispatch:                          # 允许手动触发
  schedule:
    # Runs at 03:00  10：00
    - cron: '0 3 * * *'
  push:
    # 仅当以下文件被修改时才触发
    paths:
      - 'sources1.list'
      - 'config1.yml'
      - 'abpwhite1.txt'
      - '.github/workflows/fetch.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ---------- 代码检出 ----------
      - name: 迁出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ---------- 设置时区 ----------
      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      # ---------- 安装 Python ----------
      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'

      # ---------- 安装依赖 ----------
      - name: 安装依赖
        run: pip install -r requirements.txt

      # ---------- 拉取远端最新代码（确保工作区干净） ----------
      - name: 拉取远端最新代码
        run: |
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          echo "远程默认分支: $DEFAULT_BRANCH"
          git pull --rebase origin "$DEFAULT_BRANCH"

      # ---------- 执行主抓取脚本 ----------
      - name: 执行任务
        run: python ./fetch_pro3.py

      # ---------- 预处理测速文件（新增，失败不中断） ----------
      # 调用 preprocess_speed.py 对 list.meta.yml 做安全化处理：
      #   1. 清理节点名中的 YAML 危险字符（...、#、&、* 等）
      #   2. 保证节点名唯一，避免测速结果按 name 错配
      #   3. 清理 network 字段污染（# URL fragment）
      #   4. 修复 VLESS security 与 reality-opts 字段冲突
      #   5. IPv6 server 去方括号
      #   6. 使用 NoAliasDumper 输出，禁止锚点/别名
      # 失败不中断：若本步骤失败，speed_pro1.py 会自动回退到原始文件
      # - name: 预处理测速文件
      #   run: python ./preprocess_speed.py list.meta.yml list.meta.safe.yml
      #   continue-on-error: true

      # ---------- 测速（可选，失败不中断） ----------
      # 优先使用预处理后的 list.meta.safe.yml；若不存在（预处理失败），
      # 回退到原始 list.meta.yml，保证测速步骤不会因缺少输入文件而报错。
      - name: 测试节点连通性延迟性
        run: |
          INPUT_FILE="list.meta.yml"
          if [ -f list.meta.safe.yml ]; then
            INPUT_FILE="list.meta.safe.yml"
            echo "✅ 使用预处理后的文件: $INPUT_FILE"
          else
            echo "⚠️ 未找到 list.meta.safe.yml，回退使用原始文件: $INPUT_FILE"
          fi
          python ./speed_pro1.py --delay "$INPUT_FILE" list.metaspeed.yml
        continue-on-error: true

      # ---------- 修复配置文件格式（可选） ----------
      - name: 生成标准格式文件
        run: python ./repair.py list.metaspeed.yml list.metaspeedrp.yml
        continue-on-error: true

      # ---------- 修复可预见错误（可选） ----------
      - name: 修复可预见错误
        run: python ./rebuilder_pro2.py list.metaspeedrp.yml list.metaspeedrbd.yml
        continue-on-error: true

      # ---------- 校验节点文件（方案 B：宽松模式，失败不中断） ----------
      - name: 校验节点文件
        run: |
          # 校验 list.meta.safe.yml（预处理后、rebuilder 前）
          if [ -f list.meta.safe.yml ]; then
            echo "开始校验 list.meta.safe.yml ..."
            python ./check.py list.meta.safe.yml 错误日志safe.txt || true
          else
            echo "⚠️ 未找到 list.meta.safe.yml，跳过" > 错误日志safe.txt
          fi

          # 校验 list.metaspeedrbd.yml（rebuilder 后最终文件）
          if [ -f list.metaspeedrbd.yml ]; then
            echo "开始校验 list.metaspeedrbd.yml ..."
            python ./check.py list.metaspeedrbd.yml 错误日志rbd.txt || true
          elif [ -f list.metaspeedrp.yml ]; then
            echo "list.metaspeedrbd.yml 不存在，改为校验 list.metaspeedrp.yml ..."
            python ./check.py list.metaspeedrp.yml 错误日志rp.txt || true
          elif [ -f list.metaspeed.yml ]; then
            echo "list.metaspeedrbd.yml 和 list.metaspeedrp.yml 都不存在，改为校验 list.metaspeed.yml ..."
            python ./check.py list.metaspeed.yml 错误日志speed.txt || true
          else
            echo "⚠️ 未找到 list.metaspeedrbd.yml / list.metaspeedrp.yml / list.metaspeed.yml" > 错误日志rbd.txt
          fi
        continue-on-error: true

      # ---------- 打印校验报告到 Actions 日志 ----------
      - name: 打印校验报告
        if: always()
        run: |
          if [ -f 错误日志safe.txt ]; then
            echo "========== check.py 校验报告: list.meta.safe.yml =========="
            cat 错误日志safe.txt
            echo "==========================================================="
          fi
          if [ -f 错误日志rbd.txt ]; then
            echo "========== check.py 校验报告: list.metaspeedrbd.yml =========="
            cat 错误日志rbd.txt
            echo "============================================================="
          fi
          if [ -f 错误日志rp.txt ]; then
            echo "========== check.py 校验报告: list.metaspeedrp.yml =========="
            cat 错误日志rp.txt
            echo "============================================================="
          fi
          if [ -f 错误日志speed.txt ]; then
            echo "========== check.py 校验报告: list.metaspeed.yml =========="
            cat 错误日志speed.txt
            echo "============================================================="
          fi          
      # ---------- 将两份校验报告作为 artifact 上传 ----------
      - name: 上传校验报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: |
            错误日志safe.txt
            错误日志rbd.txt
            错误日志rp.txt
            错误日志speed.txt            
          if-no-files-found: ignore

      # ---------- 提交并推送变更（不再拉取） ----------
      - name: 提交并推送变更
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          # 动态获取远程默认分支
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          echo "远程默认分支: $DEFAULT_BRANCH"

          # 添加所有需要跟踪的文件
          git add list*
          git add snippets/
          # 把校验报告也纳入版本管理
          if [ -f 错误日志.txt ]; then
            git add 错误日志.txt
          fi

          # 检查是否有变更需要提交
          if git diff --staged --quiet; then
            echo "✅ 没有文件变更，跳过提交"
          else
            COMMIT_MSG="$(date '+%Y-%m-%d %H:%M:%S') 抓取节点"
            git commit -m "$COMMIT_MSG"
            echo "✅ 提交成功: $COMMIT_MSG"

            # 推送到远程同名分支
            git push origin HEAD:"$DEFAULT_BRANCH"
            echo "✅ 推送完成"
          fi

      # ---------- 清除 CDN 缓存 ----------
      - name: 计算要清除缓存的文件
        id: purge_urls
        run: |
          sleep 5
          # 注意：如果你的默认分支是 main，请将 @master 改为 @main
          baseUrl="https://cdn.jsdelivr.net/gh/${{ github.repository }}@main"
          urls=""
          for f in `find snippets -name "*.yml" -type f`; do
            urls+="${baseUrl}/${f},"
          done
          for f in `find . -maxdepth 1 -name "list*" -type f`; do
            urls+="${baseUrl}/${f},"
          done
          echo "urls=${urls%,*}" >> $GITHUB_OUTPUT

      - name: 清除 JsDelivr CDN 缓存
        uses: gacts/purge-jsdelivr-cache@v1
        with:
          url: ${{ steps.purge_urls.outputs.urls }}
        continue-on-error: true
