# .github/workflows/fetch.yml
name: Fetchspeed

on:
  workflow_dispatch:                          # 允许手动触发
  schedule:
    # Runs at 03:00  10：00
    - cron: '0 3 * * *'
  push:
    # 仅当以下文件被修改时才触发
    paths:
      - 'sources1.list'
      - 'config1.yml'
      - 'abpwhite1.txt'
      - '.github/workflows/fetch.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ---------- 代码检出 ----------
      - name: 迁出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ---------- 设置时区 ----------
      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      # ---------- 安装 Python ----------
      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
      # ---------- 安装依赖 ----------
      # 原有依赖安装保持不变；追加 psutil（dupconfig.py --verify-nodes 复用
      # openray.validation.owned_listener 时需要通过 psutil 检查 PID 归属监听）。
      # 说明：
      #   - 如果 requirements.txt 已包含 -e . 或 openray 包，无需额外安装。
      #   - 如果 tools/install_cores.py 报 ModuleNotFoundError: openray，
      #     说明 openray 包未安装，需要在此追加 pip install -e .（前提是仓库根目录
      #     有 pyproject.toml 或 setup.py）。          
      # ---------- 安装 psutil ----------     
      - name: 安装 psutil
        run: pip install psutil
        continue-on-error: true
        
      # ---------- 安装 mihomo 二进制 ----------        
      - name: 安装 mihomo 二进制
        run: python tools/install_cores.py --destination .tools mihomo
        continue-on-error: true
      # ---------- 安装依赖 ----------
      - name: 安装依赖
        run: pip install -r requirements.txt

      # ---------- 拉取远端最新代码（确保工作区干净） ----------
      - name: 拉取远端最新代码
        run: |
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          echo "远程默认分支: $DEFAULT_BRANCH"
          git pull --rebase origin "$DEFAULT_BRANCH"

      # ---------- 执行主抓取脚本 ----------
      - name: 执行任务
        run: python ./fetch_pro3.py

      # ---------- 预处理测速文件（新增，失败不中断） ----------
      # 调用 preprocess_speed.py 对 list.meta.yml 做安全化处理：
      #   1. 清理节点名中的 YAML 危险字符（...、#、&、* 等）
      #   2. 保证节点名唯一，避免测速结果按 name 错配
      #   3. 清理 network 字段污染（# URL fragment）
      #   4. 修复 VLESS security 与 reality-opts 字段冲突
      #   5. IPv6 server 去方括号
      #   6. 使用 NoAliasDumper 输出，禁止锚点/别名
      # 失败不中断：若本步骤失败，speed_pro1.py 会自动回退到原始文件
      # - name: 预处理测速文件
      #   run: python ./preprocess_speed.py list.meta.yml list.meta.safe.yml
      #   continue-on-error: true


      
      
      # ---------- 安装 mihomo 二进制（供 dupconfig.py --verify-nodes 使用） ----------
      # 策略：优先使用仓库原生 tools/install_cores.py（版本与 SHA-256 来自
      #       openray/assets/cores.lock.json），失败则回退到 wget + sha256sum。
      # 前提：
      #   1. openray 包可 import（install_cores.py 顶层 from openray.files import atomic_write）
      #   2. openray/assets/cores.lock.json 存在
      #   3. runner 是 amd64（ubuntu-latest 满足）
      # 无论安装成功与否，后续“去重 + 协议检查 + mihomo 本地验证”步骤都会先
      # 检查 .tools/mihomo 是否存在，不存在则自动跳过 --verify-nodes，避免误删节点。
      - name: 安装 mihomo 二进制
        run: |
          set -e

          # ---- 优先：仓库原生 install_cores.py ----
          if [ -f tools/install_cores.py ] && [ -f openray/assets/cores.lock.json ]; then
            echo "尝试使用仓库原生 tools/install_cores.py 安装 mihomo..."
            if python tools/install_cores.py --destination .tools mihomo; then
              if [ -x .tools/mihomo ]; then
                echo "✅ 通过 tools/install_cores.py 安装成功: .tools/mihomo"
                .tools/mihomo -v || echo "⚠️ mihomo -v 未通过，但文件已就位"
                exit 0
              fi
            fi
            echo "⚠️ tools/install_cores.py 未产出 .tools/mihomo，回退到 wget"
          else
            echo "⚠️ 未找到 tools/install_cores.py 或 openray/assets/cores.lock.json，回退到 wget"
          fi

          # ---- 兜底：wget + sha256sum + gunzip（版本/校验值与 cores.lock.json 一致） ----
          MI_VERSION="v1.19.16"
          MI_ARCHIVE="mihomo-linux-amd64-${MI_VERSION}.gz"
          MI_BIN="mihomo-linux-amd64-${MI_VERSION}"
          MI_SHA256="d06f37a21df275bc36002b98ad35835caf9ac1b1c4cb3fad750fd2b3f94617fe"
          MI_URL="https://github.com/MetaCubeX/mihomo/releases/download/${MI_VERSION}/${MI_ARCHIVE}"

          mkdir -p .tools
          echo "下载: ${MI_URL}"
          wget -q -O "/tmp/${MI_ARCHIVE}" "${MI_URL}"
          echo "校验 SHA-256..."
          echo "${MI_SHA256}  /tmp/${MI_ARCHIVE}" | sha256sum -c -
          echo "解压..."
          gunzip -f "/tmp/${MI_ARCHIVE}"
          mv "/tmp/${MI_BIN}" ".tools/mihomo"
          chmod +x .tools/mihomo
          echo "✅ 通过 wget 安装成功: .tools/mihomo"
          .tools/mihomo -v || echo "⚠️ mihomo -v 未通过，但文件已就位"
        continue-on-error: true



      # 去重阶段现在包含两个可选增强：
      #   1. --protocol-check：用 OpenRay render.supported_params 检查协议兼容性，
      #      剔除协议级不兼容节点（纯函数检查，零出站）。
      #   2. --verify-nodes：逐个启动 mihomo 验证节点加载有效性，剔除失败节点。
      #      复用 OpenRay validation.CoreWorker + candidate_config，零出站：
      #        - 无 proxy-groups / url-test / fallback
      #        - 规则为 MATCH,<节点名>
      #        - 绑定 127.0.0.1，随机 authentication token
      #        - 只轮询本地端口 LISTEN，不发起任何外部请求
      #      --verify-workers 16 mihomo 验证阶段的并发线程数。   --verify-budget 1800  mihomo 验证阶段的总时间预算，单位秒。1800 = 30 分钟
      #      若 .tools/mihomo 不存在，自动跳过 --verify-nodes。
      
      - name: 去重 + 协议检查 + mihomo 本地验证
        run: |
          set -e
          if [ -x ".tools/mihomo" ]; then
            echo "✅ 找到 .tools/mihomo，启用 --verify-nodes"
            python dupconfig.py list.meta.yml list.meta.dub.yml \
              --clean --keep best \
              --protocol-check \
              --verify-nodes --mihomo-bin .tools/mihomo \
              --verify-workers 16 --verify-budget 1800
          else
            echo "⚠️ 未找到 .tools/mihomo，跳过 mihomo 本地验证（仅做去重 + 协议检查）"
            python dupconfig.py list.meta.yml list.meta.dub.yml \
              --clean --keep best \
              --protocol-check
          fi
        continue-on-error: true      
      # - name: 去重，九层归一化逐层对照 identity
      #   run: |
      #      python dupconfig.py list.meta.yml list.meta.dub.yml --clean --keep best
      #      # python config.py list.metaspeedrp.yml list.metaspeedrpdu.yml

      # ---------- 验证 差分模糊测试（三层测试 + 数学证明） ----------      
      - name: 验证 差分模糊测试（三层测试 + 数学证明）
        run: |
          pip install "pytest>=8.0,<9.0"
          pytest tests/test_bridge_lossless.py tests/test_bridge_equivalence.py tests/test_yaml_identity.py -v

      # ---------- 测速（可选，失败不中断） ----------
      # 优先使用预处理后的 list.meta.safe.yml；若不存在（预处理失败），
      # 回退到原始 list.meta.yml，保证测速步骤不会因缺少输入文件而报错。         
      - name: 测试节点连通性延迟性
        run: |
          INPUT_FILE="list.meta.yml"
          if [ -f list.meta.dub.yml ]; then
            INPUT_FILE="list.meta.dub.yml"
            echo "✅ 使用预处理后的文件: $INPUT_FILE"
          else
            echo "⚠️ 未找到 list.meta.dub.yml，回退使用原始文件: $INPUT_FILE"
          fi
          python ./speed_pro1.py --delay "$INPUT_FILE" list.metaspeed.yml
        continue-on-error: true

      # ---------- 修复配置文件格式（可选） ----------
      - name: 生成标准格式文件
        run: python ./repair.py list.metaspeed.yml list.metaspeedrp.yml
        continue-on-error: true

      # ---------- 修复可预见错误（可选） ----------
      - name: 修复可预见错误
        run: python ./rebuilder_pro2.py list.metaspeedrp.yml list.metaspeedrbd.yml
        continue-on-error: true

      # ---------- 校验节点文件（方案 B：宽松模式，失败不中断） ----------
      - name: 校验节点文件
        run: |
          # 校验 list.meta.dub.yml（预处理后、rebuilder 前）
          if [ -f list.meta.dub.yml ]; then
            echo "开始校验 list.meta.dub.yml ..."
            python ./check.py list.meta.dub.yml 错误日志dub.txt || true
          else
            echo "⚠️ 未找到 list.meta.dub.yml，跳过" > 错误日志dub.txt
          fi

          # 校验 list.metaspeedrbd.yml（rebuilder 后最终文件）
          if [ -f list.metaspeedrbd.yml ]; then
            echo "开始校验 list.metaspeedrbd.yml ..."
            python ./check.py list.metaspeedrbd.yml 错误日志rbd.txt || true
          elif [ -f list.metaspeedrp.yml ]; then
            echo "list.metaspeedrbd.yml 不存在，改为校验 list.metaspeedrp.yml ..."
            python ./check.py list.metaspeedrp.yml 错误日志rp.txt || true
          elif [ -f list.metaspeed.yml ]; then
            echo "list.metaspeedrbd.yml 和 list.metaspeedrp.yml 都不存在，改为校验 list.metaspeed.yml ..."
            python ./check.py list.metaspeed.yml 错误日志speed.txt || true
          else
            echo "⚠️ 未找到 list.metaspeedrbd.yml / list.metaspeedrp.yml / list.metaspeed.yml" > 错误日志rbd.txt
          fi
        continue-on-error: true

      # ---------- 打印校验报告到 Actions 日志 ----------
      - name: 打印校验报告
        if: always()
        run: |
          if [ -f 错误日志safe.txt ]; then
            echo "========== check.py 校验报告: list.meta.safe.yml =========="
            cat 错误日志safe.txt
            echo "==========================================================="
          fi
          if [ -f 错误日志rbd.txt ]; then
            echo "========== check.py 校验报告: list.metaspeedrbd.yml =========="
            cat 错误日志rbd.txt
            echo "============================================================="
          fi
          if [ -f 错误日志rp.txt ]; then
            echo "========== check.py 校验报告: list.metaspeedrp.yml =========="
            cat 错误日志rp.txt
            echo "============================================================="
          fi
          if [ -f 错误日志speed.txt ]; then
            echo "========== check.py 校验报告: list.metaspeed.yml =========="
            cat 错误日志speed.txt
            echo "============================================================="
          fi          
      # ---------- 将两份校验报告作为 artifact 上传 ----------
      - name: 上传校验报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: |
            错误日志safe.txt
            错误日志rbd.txt
            错误日志rp.txt
            错误日志speed.txt            
          if-no-files-found: ignore

      # ---------- 提交并推送变更（不再拉取） ----------
      - name: 提交并推送变更
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          # 动态获取远程默认分支
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          echo "远程默认分支: $DEFAULT_BRANCH"

          # 添加所有需要跟踪的文件
          git add list*
          git add snippets/
          # 把校验报告也纳入版本管理
          git add 错误日志*

          # 检查是否有变更需要提交
          if git diff --staged --quiet; then
            echo "✅ 没有文件变更，跳过提交"
          else
            COMMIT_MSG="$(date '+%Y-%m-%d %H:%M:%S') 抓取节点"
            git commit -m "$COMMIT_MSG"
            echo "✅ 提交成功: $COMMIT_MSG"

            # 推送到远程同名分支
            git push origin HEAD:"$DEFAULT_BRANCH"
            echo "✅ 推送完成"
          fi

      # ---------- 清除 CDN 缓存 ----------
      - name: 计算要清除缓存的文件
        id: purge_urls
        run: |
          sleep 5
          # 注意：如果你的默认分支是 main，请将 @master 改为 @main
          baseUrl="https://cdn.jsdelivr.net/gh/${{ github.repository }}@main"
          urls=""
          for f in `find snippets -name "*.yml" -type f`; do
            urls+="${baseUrl}/${f},"
          done
          for f in `find . -maxdepth 1 -name "list*" -type f`; do
            urls+="${baseUrl}/${f},"
          done
          echo "urls=${urls%,*}" >> $GITHUB_OUTPUT

      - name: 清除 JsDelivr CDN 缓存
        uses: gacts/purge-jsdelivr-cache@v1
        with:
          url: ${{ steps.purge_urls.outputs.urls }}
        continue-on-error: true
