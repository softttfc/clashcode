# .github/workflows/crawler.yml
name: Crawler Scheduled Task

on:
  schedule:
    - cron: '0 0 * * *'          # 每天凌晨 0:00（UTC 时间）运行一次。8：00
  workflow_dispatch:               # 支持手动触发

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # 授予写入仓库的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0            # 获取完整历史，用于分支信息

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # ---------- 安装依赖 ----------
      # 原有依赖安装保持不变；追加 psutil（dupconfig.py --verify-nodes 复用
      # openray.validation.owned_listener 时需要通过 psutil 检查 PID 归属监听）。
      # 说明：
      #   - 如果 requirements.txt 已包含 -e . 或 openray 包，无需额外安装。
      #   - 如果 tools/install_cores.py 报 ModuleNotFoundError: openray，
      #     说明 openray 包未安装，需要在此追加 pip install -e .（前提是仓库根目录
      #     有 pyproject.toml 或 setup.py）。          
      # ---------- 安装 psutil ----------     
      - name: 安装 psutil
        run: pip install psutil
        continue-on-error: true
   
      # ---------- 安装依赖 ----------
      - name: 安装依赖
        run: pip install -r requirements.txt
    
      # - name: Install dependencies
      #   run: |
      #     pip install requests beautifulsoup4 pyyaml requests-file aioquic
          
      # ---------- 拉取远端最新代码（确保工作区干净） ----------
      - name: 拉取远端最新代码
        run: |
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          echo "远程默认分支: $DEFAULT_BRANCH"
          git pull --rebase origin "$DEFAULT_BRANCH"
        
      - name: Run crawler
        run: python crawler_pro2.py

           # ---------- 安装 mihomo 二进制（供 dupconfig.py --verify-nodes 使用） ----------
      # 策略：优先使用仓库原生 tools/install_cores.py（版本与 SHA-256 来自
      #       openray/assets/cores.lock.json），失败则回退到 wget + sha256sum。
      # 前提：
      #   1. openray 包可 import（install_cores.py 顶层 from openray.files import atomic_write）
      #   2. openray/assets/cores.lock.json 存在
      #   3. runner 是 amd64（ubuntu-latest 满足）
      # 无论安装成功与否，后续“去重 + 协议检查 + mihomo 本地验证”步骤都会先
      # 检查 .tools/mihomo 是否存在，不存在则自动跳过 --verify-nodes，避免误删节点。
      - name: 安装 mihomo 二进制
        run: |
          set -e

          # ---- 优先：仓库原生 install_cores.py ----
          if [ -f tools/install_cores.py ] && [ -f openray/assets/cores.lock.json ]; then
            echo "尝试使用仓库原生 tools/install_cores.py 安装 mihomo..."
            if python tools/install_cores.py --destination .tools mihomo; then
              if [ -x .tools/mihomo ]; then
                echo "✅ 通过 tools/install_cores.py 安装成功: .tools/mihomo"
                .tools/mihomo -v || echo "⚠️ mihomo -v 未通过，但文件已就位"
                exit 0
              fi
            fi
            echo "⚠️ tools/install_cores.py 未产出 .tools/mihomo，回退到 wget"
          else
            echo "⚠️ 未找到 tools/install_cores.py 或 openray/assets/cores.lock.json，回退到 wget"
          fi

          # ---- 兜底：wget + sha256sum + gunzip（版本/校验值与 cores.lock.json 一致） ----
          MI_VERSION="v1.19.16"
          MI_ARCHIVE="mihomo-linux-amd64-${MI_VERSION}.gz"
          MI_BIN="mihomo-linux-amd64-${MI_VERSION}"
          MI_SHA256="d06f37a21df275bc36002b98ad35835caf9ac1b1c4cb3fad750fd2b3f94617fe"
          MI_URL="https://github.com/MetaCubeX/mihomo/releases/download/${MI_VERSION}/${MI_ARCHIVE}"

          mkdir -p .tools
          echo "下载: ${MI_URL}"
          wget -q -O "/tmp/${MI_ARCHIVE}" "${MI_URL}"
          echo "校验 SHA-256..."
          echo "${MI_SHA256}  /tmp/${MI_ARCHIVE}" | sha256sum -c -
          echo "解压..."
          gunzip -f "/tmp/${MI_ARCHIVE}"
          mv "/tmp/${MI_BIN}" ".tools/mihomo"
          chmod +x .tools/mihomo
          echo "✅ 通过 wget 安装成功: .tools/mihomo"
          .tools/mihomo -v || echo "⚠️ mihomo -v 未通过，但文件已就位"
        continue-on-error: true

      # 去重阶段现在包含两个可选增强：
      #   1. --protocol-check：用 OpenRay render.supported_params 检查协议兼容性，
      #      剔除协议级不兼容节点（纯函数检查，零出站）。
      #   2. --verify-nodes：逐个启动 mihomo 验证节点加载有效性，剔除失败节点。
      #      复用 OpenRay validation.CoreWorker + candidate_config，零出站：
      #        - 无 proxy-groups / url-test / fallback
      #        - 规则为 MATCH,<节点名>
      #        - 绑定 127.0.0.1，随机 authentication token
      #        - 只轮询本地端口 LISTEN，不发起任何外部请求
      #      --verify-workers 16 mihomo 验证阶段的并发线程数。   --verify-budget 1800  mihomo 验证阶段的总时间预算，单位秒。1800 = 30 分钟
      #      若 .tools/mihomo 不存在，自动跳过 --verify-nodes。
      
      - name: 去重 + 协议检查 + mihomo 本地验证
        run: |
          set -e
          if [ -x ".tools/mihomo" ]; then
            echo "✅ 找到 .tools/mihomo，启用 --verify-nodes"
            python dupconfig.py crawclash.yaml crawclash.dub.yaml \
              --clean --keep best \
              --protocol-check \
              --verify-nodes --mihomo-bin .tools/mihomo \
              --verify-workers 16 --verify-budget 1800
          else
            echo "⚠️ 未找到 .tools/mihomo，跳过 mihomo 本地验证（仅做去重 + 协议检查）"
            python dupconfig.py crawclash.yaml crawclash.dub.yaml \
              --clean --keep best \
              --protocol-check
          fi
        continue-on-error: true      
        
      # - name: 去重，九层归一化逐层对照 identity
      #   run: |
      #      python dupconfig.py crawclash.yaml crawclash.dub.yaml --clean --keep best
     
   
      - name: 验证 差分模糊测试（三层测试 + 数学证明）
        run: |
          pip install "pytest>=8.0,<9.0"
          pytest tests/test_bridge_lossless.py tests/test_bridge_equivalence.py tests/test_yaml_identity.py -v        
      
      - name: 生成 Meta 配置节点去重
        run: |
          INPUT_FILE="crawclash.yaml"
          if [ -f crawclash.dub.yaml ]; then
            INPUT_FILE="crawclash.dub.yaml"
            echo "✅ 使用预处理后的文件: $INPUT_FILE"
          else
            echo "⚠️ 未找到 crawclash.dub.yaml，回退使用原始文件: $INPUT_FILE"
          fi
           python config.py "$INPUT_FILE" crawclash.meta.yaml 
        
      # ---------- 修复配置文件格式（可选） ----------
      - name: 修复可预见错误1
        run: python ./rebuilder_pro2.py crawclash.meta.yaml  crawclash.metarbd.yaml
        continue-on-error: true

       # locate.py检查
      - name: locate.py检查
        run: python locate.py  crawclash.metarbd.yaml
        continue-on-error: true            

      - name: Commit and push output files
        run: |
          # 配置 Git 用户
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 获取远程默认分支（main 或 master）
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          echo "默认分支: $DEFAULT_BRANCH"

          # 1. 添加所有变更（包括新生成的文件）
          git add -A

          # 2. 如果有变更，则提交（确保工作区干净，以便后续 rebase）
          if ! git diff --staged --quiet; then
            COMMIT_MSG="Update node configs $(date -u +'%Y-%m-%d %H:%M') UTC"
            git commit -m "$COMMIT_MSG"
            echo "✅ 本地提交成功"
          else
            echo "✅ 没有文件变更，跳过提交"
          fi

          # 3. 拉取远程最新变更（使用 rebase 保持线性历史）
          # 此时工作区干净（已提交或没有变更），pull 不会报错
          # if ! git pull --rebase origin "$DEFAULT_BRANCH"; then
          #   echo "❌ pull 失败，可能远程有冲突，终止流程"
          #   exit 1
          # fi
          if ! git pull --rebase origin "$DEFAULT_BRANCH"; then
            echo "❌ pull 失败，回滚 rebase"
            git rebase --abort || true
            exit 1
          fi

          # 4. 推送当前分支到远程同名分支
          # 如果本地没有新提交，此命令会提示 "Everything up-to-date"，不会报错
          git push origin HEAD:"$DEFAULT_BRANCH"
          echo "✅ 推送完成"
